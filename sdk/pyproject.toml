[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "opendecree"
version = "0.3.0a1"
description = "Python SDK for OpenDecree — schema-driven configuration management (alpha)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "Zeev Dreifuss" },
]
keywords = ["config", "configuration", "decree", "grpc", "schema", "management"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "grpcio>=1.81.0,<2",
    "protobuf>=6.31.0,<7",
    "googleapis-common-protos>=1.75.0,<2",
]

[project.optional-dependencies]
otel = [
    "opentelemetry-instrumentation-grpc>=0.63b1",
]
docs = [
    "mkdocs-material>=9.7.6",
    "mkdocstrings[python]>=1.0.4",
]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=1.4.0",
    "mypy>=2.1.0",
    "mypy-protobuf>=5.1.0",
    "ruff>=0.15.17",
    "grpcio-tools>=1.81.0",
]

[project.urls]
Homepage = "https://github.com/opendecree/decree-python"
Documentation = "https://opendecree.github.io/decree-python"
Repository = "https://github.com/opendecree/decree-python"
Issues = "https://github.com/opendecree/decree-python/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
opendecree = ["py.typed", "_generated/**/*.pyi"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["src/opendecree/_generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/opendecree/_generated/**" = ["ALL"]
"src/opendecree/__init__.py" = ["E402"]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = "opendecree._generated.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "grpc.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "google.rpc.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "opentelemetry.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: live server required — set DECREE_TEST_ADDR to run",
]

[tool.coverage.run]
source = ["opendecree"]
omit = ["src/opendecree/_generated/*"]

[tool.coverage.report]
fail_under = 95

[tool.opendecree]
supported_server_version = ">=0.8.0,<1.0.0"
