version: 2
updates:
  - package-ecosystem: pip
    directories:
      - /sdk
      - /examples
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # grpcio-tools 1.81.1 (latest) caps protobuf<7; unignore once a
      # grpcio-tools release supports protobuf 7.x.
      - dependency-name: "protobuf"
        versions: [">=7"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
